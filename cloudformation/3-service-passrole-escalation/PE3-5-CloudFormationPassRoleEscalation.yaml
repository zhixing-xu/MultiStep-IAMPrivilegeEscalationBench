AWSTemplateFormatVersion: '2010-09-09'
Description: 'PE3-5: CloudFormation PassRole Escalation - r1 can pass r2 to CloudFormation stack to gain admin privileges'

Parameters:
  TestPrefix:
    Type: String
    Default: 'pe3-5'
    Description: 'Prefix for all resources created by this template'

Resources:
  # r2: Admin role that will be passed to CloudFormation
  AdminCFNRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${TestPrefix}-r2-admin-cfn-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/AdministratorAccess'

  # r1: Initial role with PassRole and CloudFormation permissions
  InitialRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${TestPrefix}-r1-initial'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: sts:AssumeRole
      Policies:
        - PolicyName: 'PassRoleAndCloudFormation'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: 'iam:PassRole'
                Resource: !GetAtt AdminCFNRole.Arn
              - Effect: Allow
                Action:
                  - 'cloudformation:CreateStack'
                  - 'cloudformation:DescribeStacks'
                Resource: '*'

Outputs:
  InitialRoleArn:
    Description: 'ARN of r1 - the initial role with PassRole and CloudFormation permissions'
    Value: !GetAtt InitialRole.Arn

  AdminCFNRoleArn:
    Description: 'ARN of r2 - the admin role that can be passed to CloudFormation'
    Value: !GetAtt AdminCFNRole.Arn

  EscalationPath:
    Description: 'How to escalate privileges'
    Value: 'r1 creates a CloudFormation stack with r2 (admin) role, which creates resources with admin privileges (e.g., new admin user with access keys)'

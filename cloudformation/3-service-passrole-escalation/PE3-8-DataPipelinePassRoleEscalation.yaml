AWSTemplateFormatVersion: '2010-09-09'
Description: 'PE3-8: DataPipeline PassRole Escalation - r1 can pass r2 to DataPipeline to gain admin privileges'

Parameters:
  TestPrefix:
    Type: String
    Default: 'pe3-8'
    Description: 'Prefix for all resources created by this template'

Resources:
  # r2: Admin role that will be passed to DataPipeline
  AdminDataPipelineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${TestPrefix}-r2-admin-datapipeline-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: datapipeline.amazonaws.com
            Action: sts:AssumeRole
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/AdministratorAccess'

  # r1: Initial role with PassRole and DataPipeline permissions
  InitialRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${TestPrefix}-r1-initial'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: sts:AssumeRole
      Policies:
        - PolicyName: 'PassRoleAndDataPipeline'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: 'iam:PassRole'
                Resource: !GetAtt AdminDataPipelineRole.Arn
              - Effect: Allow
                Action:
                  - 'datapipeline:CreatePipeline'
                  - 'datapipeline:PutPipelineDefinition'
                  - 'datapipeline:ActivatePipeline'
                Resource: '*'

Outputs:
  InitialRoleArn:
    Description: 'ARN of r1 - the initial role with PassRole and DataPipeline permissions'
    Value: !GetAtt InitialRole.Arn

  AdminDataPipelineRoleArn:
    Description: 'ARN of r2 - the admin role that can be passed to DataPipeline'
    Value: !GetAtt AdminDataPipelineRole.Arn

  EscalationPath:
    Description: 'How to escalate privileges'
    Value: 'r1 creates a DataPipeline with r2 (admin) role, defines shell command activities that execute with admin privileges'

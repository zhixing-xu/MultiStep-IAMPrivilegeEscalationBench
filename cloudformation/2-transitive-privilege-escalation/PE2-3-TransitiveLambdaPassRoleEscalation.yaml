AWSTemplateFormatVersion: '2010-09-09'
Description: 'PE2-3: Transitive Lambda PassRole - r1 can assume r2, r2 has PassRole + Lambda permissions to escalate via r3 (admin Lambda role)'

Parameters:
  TestPrefix:
    Type: String
    Default: 'pe2-3'
    Description: 'Prefix for all resources created by this template'

Resources:
  # r3: Admin role that can be passed to Lambda
  AdminLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${TestPrefix}-r3-admin-lambda'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/AdministratorAccess'

  # r2: Intermediate role with PassRole + Lambda permissions
  IntermediateRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${TestPrefix}-r2-intermediate'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: sts:AssumeRole
      Policies:
        - PolicyName: 'PassRoleAndLambda'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: 'iam:PassRole'
                Resource: !GetAtt AdminLambdaRole.Arn
              - Effect: Allow
                Action:
                  - 'lambda:CreateFunction'
                  - 'lambda:InvokeFunction'
                Resource: '*'

  # r1: Initial role (can only assume r2)
  InitialRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${TestPrefix}-r1-initial'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: sts:AssumeRole
      Policies:
        - PolicyName: 'AssumeR2'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: 'sts:AssumeRole'
                Resource: !GetAtt IntermediateRole.Arn

Outputs:
  InitialRoleArn:
    Description: 'ARN of r1 - the initial role with limited privileges'
    Value: !GetAtt InitialRole.Arn

  IntermediateRoleArn:
    Description: 'ARN of r2 - the intermediate role with PassRole + Lambda permissions'
    Value: !GetAtt IntermediateRole.Arn

  AdminLambdaRoleArn:
    Description: 'ARN of r3 - the admin role that can be passed to Lambda'
    Value: !GetAtt AdminLambdaRole.Arn

  EscalationPath:
    Description: 'Privilege escalation path'
    Value: 'r1 → assume r2 → PassRole r3 to Lambda → invoke Lambda with admin privileges'
